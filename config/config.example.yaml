# ============================================
# 默认配置: 小资金模式 (1万本金)
# 复制此文件为 config.yaml
# 密钥类配置建议通过环境变量注入, 不要写入配置文件:
#   TUSHARE_TOKEN / LLM_API_KEY / JZ_API_TOKEN / FEISHU_WEBHOOK / QMT_SIDECAR_TOKEN
# ============================================

# 季度目标跟踪 (核心决策约束)
goal:
  enabled: true              # 启用季度目标跟踪
  quarterly_target_pct: 0.15  # 季度收益目标 15%
  max_drawdown_budget: 0.10   # 季度最大回撤预算 10% (回撤达70%收紧敞口, 达100%进入防守)
  auto_adjust: true           # 自动调节风险敞口 (只收紧不放松; 目标达成自动锁利降仓)

tushare:
  token: ""  # 留空, 用环境变量 TUSHARE_TOKEN 注入 (https://tushare.pro/register.html)
  base_url: "http://api.tushare.pro"
  rate_limit: 450
  max_retries: 3
  retry_interval: 2

database:
  path: "data/jingzhe.db"

# A股交易费用模型
cost:
  commission_rate: 0.000085   # 佣金万0.85
  min_commission: 5.0         # 单笔最低佣金 5元
  stamp_tax_rate: 0.0005      # 印花税万5 (仅卖出)
  transfer_fee_rate: 0.00001  # 过户费万0.1

# 回测默认参数
backtest:
  start_date: "20240101"
  end_date: "20261231"
  initial_capital: 10000      # 初始资金
  benchmark: "000300.SH"
  slippage: 0.0002
  fill_price: "next_open"

# 风控参数
# 1万资金默认档: 单票上限60%, 总仓位100%, 止损-5%, 止盈+10%
# (小资金需集中持仓摊薄5元最低佣金, 单笔金额建议>=5000元)
risk:
  max_position_pct: 0.60       # 单票最大仓位 60%
  max_total_position_pct: 1.00 # 总仓位上限 100%
  max_sector_pct: 0.60         # 单板块最大仓位 60%
  stop_loss_pct: 0.05          # 止损 5%
  take_profit_pct: 0.10        # 基础止盈 10%
  trailing_stop_pct: 0.05      # 移动止盈回撤5% (盈利达止盈线后按持仓期间最高价回撤退出, 让利润奔跑; 0=不启用)
  exclude_st: true
  min_list_days: 60

# 日志
log:
  level: "info"
  format: "console"
  output: "file"
  file_path: "logs/jingzhe.log"

# 券商配置
broker:
  type: "paper"
  qmt:
    url: "http://127.0.0.1:16888"
    path: ""
    account_id: ""
    session_id: 123456

# ============================================
# 策略配置 (小资金专用)
# ============================================
strategy:
  # 均线交叉策略
  ma_cross:
    short_period: 3
    long_period: 25
    # 1万资金档: 仓位必须满足 资金×position_pct ≥ 最小交易额(默认5000元),
    # 否则买入信号会被风控 min_trade_amount 规则全部拦截
    position_pct: 0.55
    # 自适应会动态降低仓位, 小资金易跌破最小交易额门槛, 资金 ≥ 5万再开启
    enable_adaptive: false

  # MACD策略
  macd:
    fast: 12
    slow: 26
    signal: 9
    position_pct: 0.30
    enable_adaptive: true

  # 多因子策略
  multi_factor:
    top_n: 3
    rebalance_freq: "weekly"
    position_pct: 0.30
    stop_loss_pct: 0.08
    take_profit_pct: 0.15
    enable_adaptive: true

  # 日内做T策略
  intraday_t:
    t_amount_pct: 0.40
    profit_target: 0.012
    stop_loss_pct: -0.005
    lookback_days: 20

# 股票池
# 数据加载器配置
dataloader:
  filter_mode: true        # true=只拉股票池+持仓+关注列表, false=全市场
  watchlist: []             # 额外关注代码, 如: ["600519.SH"]
  enable_limit: true        # 涨跌停价（风控需要）
  enable_basic: true        # 每日基本面（多因子策略需要）
  enable_fund: true         # ETF/基金日线
  enable_cleanup: false     # 危险: 清理非关注股票历史数据, 需同时加 --confirm-cleanup

# 股票池 (可选, 留空则完全依赖自动选股)
# 手动填写的股票会与选股结果合并扫描
# 如需手动指定, 填写逗号分隔的代码: "000725.SZ,002230.SZ,..."
universe:
  bluechip: ""
  tech: ""

# HTTP 服务
server:
  port: 11270
  host: "127.0.0.1"          # 默认仅本机; 局域网访问改内网IP并务必配置 api_token
  api_token: ""              # 非空时启用鉴权, 建议用环境变量 JZ_API_TOKEN 注入
  allowed_origins:           # CORS 白名单
    - "http://localhost"
    - "http://127.0.0.1"

# 内置调度器 (server 常驻进程自动执行, Agent 只需读 API)
scheduler:
  enabled: true
  data_update_time: "15:10"  # 收盘后更新行情数据
  screener_time: "15:15"     # 全市场自动选股 (数据更新后, 信号生成前)
  signal_time: "15:30"       # 生成次日交易计划
  report_time: "15:45"       # 日报生成+飞书推送
  intraday:
    enabled: true            # 盘中止损监控
    interval_min: 5
    start: "09:30"
    end: "15:00"

# 交易执行
trading:
  auto_execute: false        # false=只生成计划等确认, true=确认后自动下单(QMT)
  min_trade_amount: 0        # 最小单笔金额, 0=自适应(最低佣金/0.1%=5000元)
  max_positions: 0           # 最大持仓数, 0=按资金自适应(<5万→2只, <20万→4只, 否则6只)

# 数据保留/自动清理 (防数据库无限膨胀)
retention:
  bar_years: 3               # 行情数据保留3年
  news_days: 30              # 新闻保留30天
  plan_days: 90              # 交易计划保留90天
  backtest_runs: 20          # 保留最近20个回测run(实盘记录永久保留)
  log_days: 30               # 日志文件保留30天
  report_files: 30           # 保留最近30个报告HTML
  cleanup_time: "16:30"      # 每日清理时间

# 自动选股 (全市场筛选, 补充配置股票池)
# 每日 15:15 自动从全市场筛选候选股票, 结果自动加入策略股票池
# 候选股票的历史K线会自动同步 (约6个月), 供策略均线计算
screener:
  enabled: true              # 是否启用 (false 则只用配置的固定股票池)
  max_candidates: 20         # 最大候选数量 (TopN)
  exclude_st: true           # 排除ST股
  min_list_days: 60          # 排除上市不足60天的新股
  min_price: 2.0             # 最低股价 (小资金避免买高价股)
  max_price: 50.0            # 最高股价 (小资金单手不超过5000元)
  min_turnover_rate: 1.0     # 最低换手率% (排除僵尸股)
  max_pe: 50.0               # 最大PE_TTM (排除高估值, 0=不限)
  max_pb: 5.0                # 最大PB (排除高估值)
  min_circ_mv: 50000.0       # 最小流通市值(万元) ≈ 50亿
  max_circ_mv: 0.0           # 最大流通市值(万元) 0=不限

# 飞书通知
feishu:
  webhook_url: ""            # 建议用环境变量 FEISHU_WEBHOOK 注入
  push_daily: true
  push_time: "15:30"

# LLM 配置 (可选)
llm:
  enabled: false
  api_key: ""                # 留空, 用环境变量 LLM_API_KEY 注入
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
